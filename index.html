<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#fffbfe" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const themes = ["light", "dark", "oled"];
        const accents = ["blue", "teal", "green", "orange", "rose", "violet"];
        const colors = { light: "#fffbfe", dark: "#1c1b1f", oled: "#000000" };
        let theme = null;
        let accent = null;
        try {
          theme = localStorage.getItem("poker.pot:theme");
          accent = localStorage.getItem("poker.pot:accent");
        } catch {
          theme = null;
          accent = null;
        }
        if (!themes.includes(theme)) {
          theme =
            typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        if (!accents.includes(accent)) {
          accent = "blue";
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.accent = accent;
        root.style.colorScheme = theme === "light" ? "light" : "dark";
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", colors[theme]);
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180.png" />
    <title>poker.pot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
