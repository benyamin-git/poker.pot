[package]
name = "poker_pot"
version = "0.1.0"
description = "Phone-friendly pot manager for poker games with friends."
authors = ["benyamin-git"]
license = ""
repository = "https://github.com/benyamin-git/poker.pot"
edition = "2024"
rust-version = "1.90"

[lib]
name = "poker_pot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"