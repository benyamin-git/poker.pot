<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Poker chip spade logo</title>
  <desc id="desc">A clean poker chip with a blue outer ring, white edge marks, and a white spade on a charcoal background.</desc>

  <rect width="512" height="512" rx="104" fill="#1c1b1f"/>

  <!-- Chip silhouette -->
  <circle cx="256" cy="256" r="176" fill="#7daeec"/>
  <circle cx="256" cy="256" r="153" fill="#1c1b1f"/>
  <circle cx="256" cy="256" r="132" fill="#7daeec"/>

  <!-- Classic edge inserts -->
  <g fill="#ffffff">
    <rect x="243" y="88" width="26" height="39" rx="5"/>
    <rect x="243" y="385" width="26" height="39" rx="5"/>
    <rect x="88" y="243" width="39" height="26" rx="5"/>
    <rect x="385" y="243" width="39" height="26" rx="5"/>
    <g transform="rotate(45 256 256)">
      <rect x="243" y="88" width="26" height="39" rx="5"/>
      <rect x="243" y="385" width="26" height="39" rx="5"/>
    </g>
  </g>

  <!-- Central field -->
  <circle cx="256" cy="256" r="101" fill="#1c1b1f"/>
  <circle cx="256" cy="256" r="91" fill="none" stroke="#7daeec" stroke-width="4"/>

  <!-- Spade -->
  <path d="M256 177
           C241 199 205 219 205 247
           C205 272 224 287 245 279
           C239 298 231 309 218 315
           L294 315
           C281 309 273 298 267 279
           C288 287 307 272 307 247
           C307 219 271 199 256 177 Z"
        fill="#ffffff"/>
  <path d="M256 177
           C241 199 205 219 205 247
           C205 272 224 287 245 279
           C239 298 231 309 218 315
           L294 315
           C281 309 273 298 267 279
           C288 287 307 272 307 247
           C307 219 271 199 256 177 Z"
        fill="none" stroke="#1c1b1f" stroke-width="5" stroke-linejoin="round"/>
</svg>
